name: Saklolo
options:
  bundleIdPrefix: com.phitopolis.saklolo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  SWIFT_VERSION: "6.0"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
targets:
  Saklolo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Saklolo
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    info:
      path: Saklolo/App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchGround
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
          - BarlowCondensed-Bold.ttf
          - BarlowCondensed-ExtraBold.ttf
        NSMicrophoneUsageDescription: "Saklolo listens for \"Tulong\" and records what happened so it can alert your contacts and guide first aid."
        NSLocationWhenInUseUsageDescription: "Saklolo includes your GPS location in the emergency SMS so contacts and responders know where you are."
        NSMotionUsageDescription: "Saklolo can use motion data to detect a fall and trigger an alert automatically."
        # saklolo:// is how the Saklolo Shortcut reports back (x-success,
        # x-error, x-cancel); see AlertCallback.
        CFBundleURLTypes:
          - CFBundleURLName: com.jaysondelosreyes.saklolo
            CFBundleURLSchemes:
              - saklolo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaysondelosreyes.saklolo
        CODE_SIGN_STYLE: Automatic
        # No DEVELOPMENT_TEAM pinned — Xcode resolves to whichever Apple ID /
        # team is signed in locally when the project is first opened.
        # If that's a Personal Team, device installs are limited to 7-day
        # provisioning renewal and no Apple Intelligence entitlement gating
        # beyond what the OS itself allows. Swap in a paid team ID here once
        # one exists.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: true
  SakloloTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SakloloTests
    dependencies:
      - target: Saklolo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaysondelosreyes.saklolo.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Saklolo:
    build:
      targets:
        Saklolo: all
        SakloloTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SakloloTests
    archive:
      config: Release
